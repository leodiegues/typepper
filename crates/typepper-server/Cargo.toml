[package]
name = "typepper-server"
version.workspace = true
edition.workspace = true
description = "typepper's server: leaderboards, accounts and shareable replays"
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# deployed to Railway (see infra/), not released with the game
[package.metadata.dist]
dist = false

[package.metadata.release]
release = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rand = "0.10.3"
# sha256 for session secrets; already built for russh
ring = "0.17.14"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
serde_json = "1.0.154"
# migrate: the migrations are compiled in (no database needed to build)
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["cors"] }
typepper-engine = { path = "../typepper-engine" }
# asks GitHub for a linking player's keys; rustls on ring, its own CA roots
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
