# Deploys typepper-server to Railway: applies infra/railway/railway.ts, then
# uploads this commit for Railway to build (infra/docker). Detached: green
# means Railway took the commit; it switches traffic once /health answers, and
# a failed build or health check leaves the previous deploy serving.
name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - crates/typepper-server/**
      - crates/typepper-engine/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - infra/**
      - .github/workflows/deploy-production.yml
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; never cancel one halfway through an apply
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the one in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p typepper-server --all-targets --locked -- -D warnings
      - run: cargo test -p typepper-server --locked

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: Production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.18
          install_args: node github:railwayapp/cli # pinned, with checksums, in mise.toml / mise.lock
      # --yes without --confirm-destructive: an apply that would delete
      # anything (the TCP proxy's port is in released games) fails instead
      - run: mise run infra:apply -- --yes
      - run: mise run infra:deploy
