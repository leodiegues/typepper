name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # the server's tests run against it (TYPEPPER_TEST_DATABASE_URL), the
    # same major as Railway's
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_PASSWORD: typepper
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TYPEPPER_TEST_DATABASE_URL: postgres://postgres:typepper@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # the one in rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (web)
        run: cargo clippy -p typepper --target wasm32-unknown-unknown --locked -- -D warnings
      # nothing else builds for Windows before a release tag does
      - name: clippy (windows)
        run: |
          rustup target add x86_64-pc-windows-msvc # here, not in rust-toolchain.toml: the other builds don't need it
          cargo clippy -p typepper --target x86_64-pc-windows-msvc --locked -- -D warnings
      - run: cargo test --workspace --locked
